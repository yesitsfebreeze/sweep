on: [push, pull_request, workflow_dispatch]

permissions:
  actions: read
  contents: write

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release

      - name: Package firmware
        run: zip -j sweep-firmware.zip release/*.uf2

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest sweep-firmware.zip --clobber
            gh release edit latest --target "$GITHUB_SHA"
          else
            gh release create latest sweep-firmware.zip \
              --target "$GITHUB_SHA" \
              --title "Latest firmware" \
              --notes "Automatically generated from the latest successful build on main."
          fi